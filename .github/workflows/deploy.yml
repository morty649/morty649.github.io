name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Picks up new and deleted Medium stories. Deploys only when something changed.
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  # Scheduled syncs get their own group so they never cancel a deploy from a push.
  group: pages-${{ github.event_name == 'schedule' && 'medium-sync' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Saves synced Medium stories to the medium-cache branch.
      contents: write
    outputs:
      deploy: ${{ github.event_name != 'schedule' || steps.medium.outputs.changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Medium's feed only lists the latest 10 stories, so earlier syncs are kept on the
      # medium-cache branch (outside main, so it never conflicts with local pushes).
      - name: Sync Medium stories
        id: medium
        run: |
          if git fetch --quiet --depth=1 origin medium-cache; then
            git show FETCH_HEAD:medium.json > content/medium.json
          fi
          before=$(cat content/medium.json 2>/dev/null || true)
          node scripts/sync-medium.mjs
          after=$(cat content/medium.json 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Medium stories
        if: steps.medium.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          cache="$RUNNER_TEMP/medium-cache"
          mkdir "$cache" && cp content/medium.json "$cache/"
          cd "$cache"
          git init --quiet && git checkout --quiet -b medium-cache
          git add medium.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Sync Medium stories"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:medium-cache

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.medium.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static site
        if: github.event_name != 'schedule' || steps.medium.outputs.changed == 'true'
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.medium.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
